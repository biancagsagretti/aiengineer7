services:
  api:
    build: .
    env_file:
      - .env
    environment:
      # Dentro de Docker, Redis se alcanza por el nombre del servicio (pisa lo que diga .env).
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      phoenix:
        condition: service_started
    restart: unless-stopped

  # redis-stack-server incluye RedisJSON y RediSearch, que exige el checkpointer de LangGraph.
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /phoenix
      PHOENIX_ENABLE_AUTH: "false"
    volumes:
      - phoenix_data:/phoenix

volumes:
  redis_data:
  qdrant_data:
  phoenix_data:
